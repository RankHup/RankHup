<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RankHUP - Random Joke</title>
<style>
  :root {
    --pink: #ff2d6d;
    --pink-soft: #ff2d6d55;
    --yellow: #ffcc33;
    --bg: #000;
    --card-bg: #0d0d0d;
    --border: #1a1a1a;
    --border-soft: #2a2a2a;
    --text-muted: #999;
    --text-faint: #777;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    background:var(--bg);
    color:#fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 12px;
    gap: 12px;
  }

  /* Header */
  header {
    width:100%;
    max-width:900px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 12px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .logo { display:flex; align-items:center; gap:8px; }
  .logo-icon { font-size:18px; }
  .logo-block { display:flex; flex-direction:column; }
  .logo-text { font-size:16px; font-weight:800; }
  .logo-text .rank { color:#fff; }
  .logo-text .hup { color:var(--pink); }
  .tagline { font-size:8px; color:var(--text-muted); margin-top:-2px; }

  .new-joke-btn {
    display:flex; align-items:center; gap:6px;
    color:#fff; font-weight:600; font-size:11px;
    cursor:pointer; user-select:none;
    background:none; border:none;
  }
  .new-joke-btn svg { width:13px; height:13px; }

  /* Hero */
  .hero { text-align:center; padding:2px 10px; flex-shrink:0; }
  .hero h1 { font-size:clamp(16px, 2.5vh, 22px); font-weight:800; }
  .hero h1 .emoji { margin-right:4px; }
  .hero h1 .accent { color:var(--pink); }
  .hero p { color:var(--text-muted); margin-top:2px; font-size:11px; }
  .underline {
    width:36px; height:2px; background:var(--pink);
    margin:4px auto 0; border-radius:2px;
  }

  /* Joke Card */
  .joke-card {
    width:100%; max-width:900px;
    background:var(--card-bg);
    border:1px solid var(--pink-soft);
    border-radius:14px;
    padding:16px 20px;
    text-align:center;
    box-shadow: 0 0 20px rgba(255,45,109,0.05);
    flex-shrink: 0;
  }
  .quote-mark { font-size:24px; color:var(--pink); font-weight:800; line-height:1; }
  .setup { font-size:clamp(15px, 2.2vh, 22px); font-weight:800; margin-top:4px; line-height:1.3; }
  .divider { width:36px; height:2px; background:var(--pink-soft); margin:10px auto; }
  .punchline { font-size:clamp(13px, 2vh, 19px); font-weight:800; color:var(--yellow); line-height:1.3; }

  .actions {
    display:flex; gap:8px; justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .btn {
    display:flex; align-items:center; gap:5px;
    padding:8px 14px;
    border-radius:8px;
    font-weight:700;
    font-size:12px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-funny { background:#1db954; color:#fff; }
  .btn-not-funny { background:var(--pink); color:#fff; }
  .btn-next { background:#1a1a1a; color:#fff; border:1px solid var(--border-soft); }
  .btn svg { width:13px; height:13px; }

  .stats { margin-top:10px; color:var(--text-muted); font-size:11px; }
  .stats .percent { color:var(--pink); font-weight:700; }
  .vote-count { color:#666; font-size:10px; margin-top:2px; }

  /* Ad boxes */
  .ad-box {
    width:100%; max-width:900px;
    border:1.5px dashed var(--border-soft);
    border-radius:10px;
    padding:6px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow: hidden;
  }
  
  .ad-top-banner {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  footer {
    color:var(--text-faint);
    font-size:10px;
    display:flex; align-items:center; gap:4px;
    flex-shrink:0;
    padding:4px 0;
  }
  footer .heart { color:var(--pink); }
</style>
</head>
<body>

<header>

    <span class="logo-icon">👑</span>
    <div class="logo-block">
      <div class="logo-text"><span class="rank">Rank</span><span class="hup">HUP</span></div>
      <div class="tagline">Laugh More. Live Better.</div>
    </div>
  </div>
  <button class="new-joke-btn" id="newJokeBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    New Joke
  </button>
</header>

      <svg viewBox="0 0 24 24" fill="white"><path d="M22 3h-4v12h4V3zM2 14c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L10.83 23l5.58-5.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2H5.83c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2z"/></svg>

<script>
(function () {
  const JOKES = [
    ["Why don't skeletons fight each other?", "Because they don't have the guts."],
    ["Why did the scarecrow win an award?", "Because he was outstanding in his field."],
    ["Why don't eggs tell jokes?", "They'd crack each other up."],
    ["What do you call fake spaghetti?", "An impasta."],
    ["Why did the bicycle fall over?", "It was two-tired."],
    ["Why can't you give Elsa a balloon?", "She'll let it go."],
    ["What do you call a bear with no teeth?", "A gummy bear."],
    ["Why did the coffee file a police report?", "It got mugged."],
    ["Why don't scientists trust atoms?", "Because they make up everything."],
    ["What do you call a fish with no eyes?", "A fsh."]
  ];

  const setupEl = document.getElementById('setup');
  const punchlineEl = document.getElementById('punchline');
  const percentEl = document.getElementById('percent');
  const votesEl = document.getElementById('votes');

  let lastIndex = -1;

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pickNextJokeIndex() {
    if (JOKES.length === 1) return 0;
    let index;
    do {
      index = randomInt(0, JOKES.length - 1);
    } while (index === lastIndex);
    return index;
  }

  function updateStats() {
    const percent = randomInt(80, 99);
    const votes = randomInt(10000, 209999);
    percentEl.textContent = percent + '%';
    votesEl.textContent = votes.toLocaleString() + ' votes';
  }

  function showJoke(index) {
    const [setup, punchline] = JOKES[index];
    setupEl.textContent = setup;
    punchlineEl.textContent = punchline;
    updateStats();
    lastIndex = index;
  }

  function loadJoke() {
    showJoke(pickNextJokeIndex());
  }

  function vote() {
    loadJoke();
  }

  document.getElementById('newJokeBtn').addEventListener('click', loadJoke);
  document.getElementById('nextJokeBtn').addEventListener('click', loadJoke);
  document.getElementById('funnyBtn').addEventListener('click', () => vote(true));
  document.getElementById('notFunnyBtn').addEventListener('click', () => vote(false));
})();
</script>

</body>
