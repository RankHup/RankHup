<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RankHUP - Random Joke</title>
<style>
  :root {
    --pink: #ff2d6d;
    --pink-soft: #ff2d6d55;
    --yellow: #ffcc33;
    --bg: #000;
    --card-bg: #0d0d0d;
    --border: #1a1a1a;
    --border-soft: #2a2a2a;
    --text-muted: #999;
    --text-faint: #777;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    background:var(--bg);
    color:#fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 12px;
    gap: 12px;
  }

  /* Header */
  header {
    width:100%;
    max-width:900px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 12px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .logo { display:flex; align-items:center; gap:8px; }
  .logo-icon { font-size:18px; }
  .logo-block { display:flex; flex-direction:column; }
  .logo-text { font-size:16px; font-weight:800; }
  .logo-text .rank { color:#fff; }
  .logo-text .hup { color:var(--pink); }
  .tagline { font-size:8px; color:var(--text-muted); margin-top:-2px; }

  .new-joke-btn {
    display:flex; align-items:center; gap:6px;
    color:#fff; font-weight:600; font-size:11px;
    cursor:pointer; user-select:none;
    background:none; border:none;
  }
  .new-joke-btn svg { width:13px; height:13px; }

  /* Hero */
  .hero { text-align:center; padding:2px 10px; flex-shrink:0; }
  .hero h1 { font-size:clamp(16px, 2.5vh, 22px); font-weight:800; }
  .hero h1 .emoji { margin-right:4px; }
  .hero h1 .accent { color:var(--pink); }
  .hero p { color:var(--text-muted); margin-top:2px; font-size:11px; }
  .underline {
    width:36px; height:2px; background:var(--pink);
    margin:4px auto 0; border-radius:2px;
  }

  /* Joke Card */
  .joke-card {
    width:100%; max-width:900px;
    background:var(--card-bg);
    border:1px solid var(--pink-soft);
    border-radius:14px;
    padding:16px 20px;
    text-align:center;
    box-shadow: 0 0 20px rgba(255,45,109,0.05);
    flex-shrink: 0;
  }
  .quote-mark { font-size:24px; color:var(--pink); font-weight:800; line-height:1; }
  .setup { font-size:clamp(15px, 2.2vh, 22px); font-weight:800; margin-top:4px; line-height:1.3; }
  .divider { width:36px; height:2px; background:var(--pink-soft); margin:10px auto; }
  
  /* Punchline hidden by default */
  .punchline { 
    font-size:clamp(13px, 2vh, 19px); 
    font-weight:800; 
    color:var(--yellow); 
    line-height:1.3; 
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .punchline.visible {
    display: block;
    opacity: 1;
  }

  .actions {
    display:flex; gap:8px; justify-content:center;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .btn {
    display:flex; align-items:center; gap:5px;
    padding:10px 20px;
    border-radius:8px;
    font-weight:700;
    font-size:13px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-reveal { background:var(--pink); color:#fff; width: 100%; max-width: 250px; justify-content: center; }
  .btn-next { background:#1db954; color:#fff; display: none; width: 100%; max-width: 250px; justify-content: center; }
  .btn svg { width:13px; height:13px; }

  /* Ad boxes */
  .ad-box {
    width:100%; max-width:900px;
    border:1.5px dashed var(--border-soft);
    border-radius:10px;
    padding:6px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow: hidden;
  }
  
  .ad-top-banner {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }

  footer {
    color:var(--text-faint);
    font-size:10px;
    display:flex; align-items:center; gap:4px;
    flex-shrink:0;
    padding:4px 0;
  }
  footer .heart { color:var(--pink); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">👑</span>
    <div class="logo-block">
      <div class="logo-text"><span class="rank">Rank</span><span class="hup">HUP</span></div>
      <div class="tagline">Laugh More. Live Better.</div>
    </div>
  </div>
  <button class="new-joke-btn" id="newJokeBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    New Joke
  </button>
</header>

      Tap for Answer
    </button>

      <svg viewBox="0 0 24 24" fill="white"><path d="M17 3H7c-1.1 0-2 .9-2 2v14l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      Next Joke ➔
    </button>
  </div>
</div>

    ["Why did the student eat his homework?", "Because the teacher said it was a piece of cake."],
    ["What do you call a bird that refuses to work?", "A lazy-bird."],
    ["Why did the ghost go to the bar?", "For the boos."],
    ["What do you call a very small valentine?", "A valentime."],
    ["Why did the firefly fail school?", "Because it wasn't too bright."],
    ["What do you call a dinosaur with a bad vocabulary?", "A thesaurus."],
    ["Why did the elephant paint his toenails red?", "To hide in the strawberry patch."],
    ["Have you ever seen an elephant in a strawberry patch?", "No? Well, it works, doesn't it?"],
    ["What do you call a blind dinosaur?", "A Do-you-think-he-saurus."],
    ["What do you call a blind dinosaur's dog?", "A Do-you-think-he-saurus rex."],
    ["Why did the barber win the race?", "Because he took a short cut."],
    ["What do you call a bear with a map?", "A navigator."],
    ["Why did the orange stop rolling?", "Because it ran out of juice."],

    ["What do you call a penguin in the desert?", "Lost."],
    ["Why did the clock get thrown out the window?", "Because it wanted to see time fly."],

    ["Why did the broom get a promotion?", "Because it swept the competition."],
    ["What do you call a snake that builds houses?", "A boa constructor."],
    ["Why did the cookie cry?", "Because its mother was a wafer so long."],

    ["Why did the singer climb a ladder?", "To reach the high notes."],
    ["What do you call a frog with no legs?", "Hopless."],

    ["Why did the teacher wear sunglasses to school?", "Because her students were so bright."],
    ["What do you call a bear in a tree?", "A branch manager."],
    ["Why did the skeleton go to the party alone?", "Because he had no body to go with."],
    ["What do you call a rabbit with fleas?", "Bugs bunny's worst nightmare."],
    ["Why did the lemon stop at the green light?", "Because it was sour."],
    ["What do you call a cat with eight legs?", "An octo-puss."],
    ["Why did the robber hide in the bakery?", "Because he kneaded the dough."],
    ["What do you call a dinosaur that loves to sleep?", "A snore-asaurus."],
    ["Why did the pencil cross the road?", "Because it had no point."],
    ["What do you call a pig that knows karate?", "Pork chop."],
    ["Why did the kid throw his watch out the window?", "To see time fly."],
    ["What do you call a bear with no ears?", "B."],
    ["Why did the spider go to the computer?", "To check his web site."],
    ["What do you call a very polite snake?", "A h-and-s serpent."]
  ];

  const setupEl = document.getElementById('setup');
  const punchlineEl = document.getElementById('punchline');
  const revealBtn = document.getElementById('revealBtn');
  const nextJokeBtn = document.getElementById('nextJokeBtn');
  const newJokeBtn = document.getElementById('newJokeBtn');

  let lastIndex = -1;

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pickNextJokeIndex() {
    if (JOKES.length === 1) return 0;
    let index;
    do {
      index = randomInt(0, JOKES.length - 1);
    } while (index === lastIndex);
    return index;
  }

  function showJoke(index) {
    const [setup, punchline] = JOKES[index];
    setupEl.textContent = setup;
    punchlineEl.textContent = punchline;
    
    // إخفاء الجواب وإظهار زر "اضغط للجواب" عند جلب نكتة جديدة
    punchlineEl.classList.remove('visible');
    revealBtn.style.display = 'flex';
    nextJokeBtn.style.display = 'none';

    lastIndex = index;
  }

  function loadJoke() {
    showJoke(pickNextJokeIndex());
  }

  // عند الضغط على إظهار الجواب
  revealBtn.addEventListener('click', () => {
    punchlineEl.classList.add('visible');
    revealBtn.style.display = 'none';
    nextJokeBtn.style.display = 'flex';
  });

  newJokeBtn.addEventListener('click', loadJoke);
  nextJokeBtn.addEventListener('click', loadJoke);
})();
</script>
